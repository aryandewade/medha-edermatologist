<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070c18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="ringglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>

  <!-- 3D Spacer Reticle Circular Guide -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#2563eb" stroke-width="8" stroke-dasharray="16 12"/>
  <circle cx="256" cy="256" r="140" fill="url(#ringglow)"/>

  <!-- Center Crosshair -->
  <line x1="256" y1="136" x2="256" y2="166" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  <line x1="256" y1="346" x2="256" y2="376" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  <line x1="136" y1="256" x2="166" y2="256" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  <line x1="346" y1="256" x2="376" y2="256" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>

  <!-- Medical Cross / Pulse Icon in center -->
  <path d="M256 196 V316 M196 256 H316" stroke="url(#accent)" stroke-width="24" stroke-linecap="round"/>
  <circle cx="256" cy="256" r="14" fill="#ffffff"/>
</svg>
